<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Todo{% endblock %}</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
        color: #1f2937;
        background: #f3f4f6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
      }

      .skip-link {
        position: absolute;
        top: -3rem;
        left: 1rem;
        padding: 0.5rem 0.75rem;
        color: #ffffff;
        background: #111827;
        z-index: 1;
      }

      .skip-link:focus {
        top: 1rem;
      }

      a {
        color: #1d4ed8;
      }

      header,
      main {
        width: min(100% - 2rem, 48rem);
        margin-inline: auto;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding-block: 1.25rem;
      }

      header a {
        text-decoration: none;
      }

      nav {
        display: flex;
        gap: 1rem;
      }

      main {
        padding-bottom: 3rem;
      }

      .panel,
      .todo-card {
        padding: 1.5rem;
        border: 1px solid #d1d5db;
        border-radius: 0.75rem;
        background: #ffffff;
      }

      .todo-list {
        display: grid;
        gap: 1rem;
        padding: 0;
        list-style: none;
      }

      .todo-card h2 {
        margin-top: 0;
      }

      .status {
        display: inline-block;
        margin-bottom: 1rem;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        background: #e5e7eb;
        font-size: 0.875rem;
      }

      .status.completed {
        color: #166534;
        background: #dcfce7;
      }

      .form-group {
        display: grid;
        gap: 0.4rem;
        margin-bottom: 1rem;
      }

      input[type="text"],
      textarea {
        width: 100%;
        padding: 0.7rem;
        border: 1px solid #6b7280;
        border-radius: 0.4rem;
        font: inherit;
      }

      textarea {
        min-height: 8rem;
        resize: vertical;
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }

      .actions form {
        margin: 0;
      }

      button,
      .button {
        display: inline-block;
        padding: 0.55rem 0.9rem;
        border: 1px solid #1d4ed8;
        border-radius: 0.4rem;
        color: #ffffff;
        background: #1d4ed8;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }

      .button.secondary {
        border-color: #6b7280;
        color: #374151;
        background: #ffffff;
      }

      button.danger {
        border-color: #b91c1c;
        background: #b91c1c;
      }

      .description {
        white-space: pre-wrap;
      }

      .empty {
        color: #4b5563;
      }
    </style>
  </head>
  <body>
    <a class="skip-link" href="#main-content">본문으로 건너뛰기</a>
    <header>
      <a href="/"><strong>Todo</strong></a>
      <nav aria-label="주요 메뉴">
        <a href="/todos">목록</a>
        <a href="/todos/new">새 Todo</a>
      </nav>
    </header>
    <main id="main-content">
      {% block content %}{% endblock %}
    </main>
  </body>
</html>
