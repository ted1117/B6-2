[project]
name = "b6-2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pytest>=9.1.1",
    "ruff>=0.16.5",
    "sqlalchemy>=2.0.52",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # import 정렬
    "B",    # flake8-bugbear
    "UP",   # 최신 Python 문법 권장
    "SIM",  # 불필요하게 복잡한 코드 단순화
]

ignore = [
    "B008",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
