{% extends "base.html" %}

{% block title %}작업 추가{% endblock %}

{% block content %}
  <section class="panel">
    <h1>작업 추가</h1>
    <form method="post" action="/todos">
      <div class="form-group">
        <label for="title">제목</label>
        <input id="title" name="title" type="text" maxlength="100" required="required" autofocus="autofocus">
      </div>
      <div class="form-group">
        <label for="description">상세 내용</label>
        <textarea id="description" name="description"></textarea>
      </div>
      <div class="actions">
        <button type="submit">생성</button>
        <a class="button secondary" href="/todos">취소</a>
      </div>
    </form>
  </section>
{% endblock %}
